<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0f14"><title>Livermore Today</title><link rel="manifest" href="/manifest.webmanifest"><style>:root{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Inter,sans-serif;color:#f4f7fb;background:#0b0f14}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#0b0f14,#111824);min-height:100vh}.wrap{max-width:760px;margin:auto;padding:18px 16px 40px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.title{font-size:28px;font-weight:800}.sub{font-size:12px;color:#95a2b3}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.card{background:#151d29;border:1px solid #223044;border-radius:20px;padding:16px;box-shadow:0 10px 30px #0005}.ticker{font-size:20px;font-weight:800}.price{font-size:27px;font-weight:800;margin-top:8px}.chg.up{color:#60d394}.chg.down{color:#ff6b6b}.meta{font-size:12px;color:#9daabc;margin-top:6px;line-height:1.4}.state{display:inline-block;margin-top:12px;padding:6px 10px;border-radius:999px;background:#253247;font-weight:700;font-size:12px}.state.buy{background:#113a2b;color:#72e0a7}.state.wait{background:#2a3241;color:#d4d9e2}.state.warn{background:#493812;color:#ffd36a}.state.sell{background:#4b2020;color:#ff9d9d}.state.add{background:#173b4b;color:#8edfff}.state.hold{background:#203a31;color:#9ee2bc}.row{display:flex;justify-content:space-between;font-size:12px;margin-top:7px;color:#b8c1cf}.note{margin-top:16px;font-size:12px;color:#8e9aab;line-height:1.5}.error{color:#ff8b8b;font-size:12px;margin-top:8px}.refresh{background:#f2f5f8;color:#111827;border:0;border-radius:12px;padding:10px 14px;font-weight:800}.pill{font-size:11px;color:#7f8da0}.loading{opacity:.65}.entrybox{margin-top:14px;padding-top:12px;border-top:1px solid #253247}.entrytitle{font-size:12px;font-weight:800;color:#dce4ef;margin-bottom:8px}.entrygrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.entryinput{width:100%;background:#0f1620;color:#f4f7fb;border:1px solid #2a394d;border-radius:10px;padding:9px 10px;font-size:12px;outline:none}.entryinput:focus{border-color:#58708f}.savebtn{width:100%;margin-top:8px;background:#253247;color:#f4f7fb;border:0;border-radius:10px;padding:9px 10px;font-weight:800;font-size:12px}.levels{margin-top:10px;padding-top:8px;border-top:1px dashed #2a394d}.levelhit{color:#72e0a7}.levelnext{color:#8edfff}.leveldanger{color:#ff9d9d}@media(max-width:520px){.grid{grid-template-columns:1fr}.title{font-size:25px}}</style></head><body><div class="wrap"><div class="top"><div><div class="title">Livermore Today</div><div class="sub">TQQQ · QQQ · TMF · NVDA · VOO · AAPL · V</div></div><button id="refresh" class="refresh">새로고침</button></div><div id="updated" class="pill">불러오는 중…</div><div id="grid" class="grid" style="margin-top:12px"></div><div class="note">현재가는 가능한 최신 Yahoo 시세를 표시하고, 공식 매수·매도 신호는 확정된 일봉 종가로 계산해. 진입일과 진입가는 이 기기에 저장되며, 추가매수·손절·트레일링 기준은 자동 계산돼.</div></div><script>const symbols=[['TQQQ',3],['QQQ',1],['TMF',3],['NVDA',1],['VOO',1],['AAPL',1],['V',1]];const STORE='livermore-entry-v2';function fmt(n){return n==null||!Number.isFinite(Number(n))?'—':'$'+Number(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})}function pct(n){return n==null||!Number.isFinite(Number(n))?'—':(n*100).toFixed(2)+'%'}function getStore(){try{return JSON.parse(localStorage.getItem(STORE)||'{}')}catch{return {}}}function setEntry(sym,date,price){const s=getStore();if(!date&&!price){delete s[sym]}else{s[sym]={date,price:Number(price)||null}}localStorage.setItem(STORE,JSON.stringify(s));load()}async function yahoo(sym,range='10y',interval='1d'){const u=`/api/yahoo?symbol=${encodeURIComponent(sym)}&range=${encodeURIComponent(range)}&interval=${encodeURIComponent(interval)}`;const r=await fetch(u,{cache:'no-store'});if(!r.ok)throw new Error('시세 조회 실패');const j=await r.json();if(j?.error)throw new Error(j.error);return j.chart?.result?.[0]}function sma(a,n){let s=0,cnt=0,out=Array(a.length).fill(null);for(let i=0;i<a.length;i++){if(a[i]!=null){s+=a[i];cnt++}if(i>=n&&a[i-n]!=null){s-=a[i-n];cnt--}if(i>=n-1&&cnt===n)out[i]=s/n}return out}function prevHigh(a,n,i){if(i<n)return null;let m=-Infinity;for(let k=i-n;k<i;k++)if(a[k]!=null)m=Math.max(m,a[k]);return Number.isFinite(m)?m:null}function dateStr(ts){return new Date(ts*1000).toISOString().slice(0,10)}function positionFromEntry(close,timestamps,entryDate,entryPrice,lev){if(!entryDate||!entryPrice)return null;let start=timestamps.findIndex(t=>dateStr(t)>=entryDate);if(start<0)start=0;const addStep=.04*lev,stopPct=.06*lev,trailPct=.15*lev;const add1=entryPrice*(1+addStep),add2=add1*(1+addStep);let maxClose=entryPrice,add1Hit=false,add2Hit=false,add1Date=null,add2Date=null;for(let i=start;i<close.length;i++){const c=close[i];if(c==null)continue;maxClose=Math.max(maxClose,c);if(!add1Hit&&c>=add1){add1Hit=true;add1Date=dateStr(timestamps[i])}if(add1Hit&&!add2Hit&&c>=add2){add2Hit=true;add2Date=dateStr(timestamps[i])}}let avg=entryPrice,invested=.40;if(add1Hit){avg=(entryPrice*.40+add1*.30)/.70;invested=.70}if(add2Hit){avg=(entryPrice*.40+add1*.30+add2*.30);invested=1}const stop=avg*(1-stopPct),trail=maxClose*(1-trailPct),sell=Math.max(stop,trail);const latest=close[close.length-1];let pstate='HOLD',pcls='hold',reason='보유 유지';if(latest<=sell){pstate='SELL';pcls='sell';reason='매도 기준 충족'}else if(!add1Hit&&latest>=add1){pstate='ADD 1';pcls='add';reason='1차 추가매수 기준 충족'}else if(!add1Hit&&latest>=add1*.98){pstate='ADD 1 접근';pcls='add';reason='1차 추가매수 기준에 근접'}else if(add1Hit&&!add2Hit&&latest>=add2){pstate='ADD 2';pcls='add';reason='2차 추가매수 기준 충족'}else if(add1Hit&&!add2Hit&&latest>=add2*.98){pstate='ADD 2 접근';pcls='add';reason='2차 추가매수 기준에 근접'}else if(latest<=sell*1.05){pstate='WARNING';pcls='warn';reason='매도선 5% 이내'}return{add1,add2,add1Hit,add2Hit,add1Date,add2Date,avg,invested,maxClose,stop,trail,sell,pstate,pcls,reason}}async function analyze(sym,lev){const d=await yahoo(sym,'10y','1d');if(!d)throw new Error('데이터 없음');const q=d.indicators.quote[0],adj=d.indicators.adjclose?.[0]?.adjclose||q.close;const close=q.close.map((v,i)=>adj[i]??v);const ts=d.timestamp;const ma=sma(close,200);let i=close.length-1;while(i>0&&close[i]==null)i--;const c=close[i],ph=prevHigh(close,40,i),m=ma[i];const meta=d.meta||{};const live=meta.regularMarketPrice??q.close[i]??c;let rawI=q.close.length-1;while(rawI>0&&q.close[rawI]==null)rawI--;const lastRaw=q.close[rawI];const sameSession=lastRaw!=null&&Math.abs(lastRaw-live)/Math.max(Math.abs(live),.01)<.02;let prevRawIndex=sameSession?rawI-1:rawI;while(prevRawIndex>0&&q.close[prevRawIndex]==null)prevRawIndex--;const prev=q.close[prevRawIndex];let ch=prev!=null&&prev>0?live/prev-1:null;if(ch!=null&&Math.abs(ch)>1)ch=null;const breakout=ph!=null&&c>ph,above=m!=null&&c>m;let state=above&&breakout?'BUY':'WAIT';let cls=state==='BUY'?'buy':'wait';const saved=getStore()[sym]||{};const pos=positionFromEntry(close.slice(0,i+1),ts.slice(0,i+1),saved.date,saved.price,lev);if(pos){state=pos.pstate;cls=pos.pcls}return{sym,lev,live,ch,c,m,ph,state,cls,time:meta.regularMarketTime,saved,pos}}function posRows(x){const p=x.pos;if(!p)return'';const add1Status=p.add1Hit?`✓ ${p.add1Date||''}`:'대기',add2Status=p.add2Hit?`✓ ${p.add2Date||''}`:'대기';return`<div class="levels"><div class="row"><span>1차 추가매수</span><b class="${p.add1Hit?'levelhit':'levelnext'}">${fmt(p.add1)} · ${add1Status}</b></div><div class="row"><span>2차 추가매수</span><b class="${p.add2Hit?'levelhit':'levelnext'}">${fmt(p.add2)} · ${add2Status}</b></div><div class="row"><span>현재 평균단가</span><b>${fmt(p.avg)}</b></div><div class="row"><span>현재 포지션</span><b>${Math.round(p.invested*100)}%</b></div><div class="row"><span>진입 후 최고 종가</span><b>${fmt(p.maxClose)}</b></div><div class="row"><span>손절선</span><b class="leveldanger">${fmt(p.stop)}</b></div><div class="row"><span>트레일링선</span><b class="leveldanger">${fmt(p.trail)}</b></div><div class="row"><span>실질 매도선</span><b class="leveldanger">${fmt(p.sell)}</b></div><div class="meta">${p.reason}</div></div>`}function card(x){const d=x.saved.date||'',pr=x.saved.price||'';return`<div class="card"><div class="ticker">${x.sym} <span class="pill">${x.lev}×</span></div><div class="price">${fmt(x.live)}</div><div class="chg ${x.ch>=0?'up':'down'}">${x.ch==null?'전일대비 —':'전일대비 '+(x.ch>=0?'+':'')+pct(x.ch)}</div><div class="state ${x.cls}">${x.state}</div><div class="row"><span>확정 종가</span><b>${fmt(x.c)}</b></div><div class="row"><span>200일선</span><b>${fmt(x.m)}</b></div><div class="row"><span>40일 돌파선</span><b>${fmt(x.ph)}</b></div><div class="row"><span>돌파선까지</span><b>${x.ph&&x.c?pct(x.ph/x.c-1):'—'}</b></div><div class="entrybox"><div class="entrytitle">내 진입 정보</div><div class="entrygrid"><input id="date-${x.sym}" class="entryinput" type="date" value="${d}" aria-label="${x.sym} 진입일"><input id="price-${x.sym}" class="entryinput" type="number" step="0.01" inputmode="decimal" placeholder="진입가 ($)" value="${pr}"></div><button class="savebtn" onclick="setEntry('${x.sym}',document.getElementById('date-${x.sym}').value,document.getElementById('price-${x.sym}').value)">저장 / 다시계산</button>${posRows(x)}</div><div class="meta">${x.pos?'입력한 진입정보 기준으로 관리 중':(x.state==='BUY'?'200일선 위 + 40일 신고가 돌파':'신규매수 조건 미충족')}</div></div>`}async function load(){const g=document.getElementById('grid');g.classList.add('loading');g.innerHTML='';let arr=[];for(const[s,l]of symbols){try{arr.push(await analyze(s,l))}catch(e){g.innerHTML+=`<div class="card"><div class="ticker">${s}</div><div class="error">${e.message}</div></div>`}}if(arr.length)g.innerHTML=arr.map(card).join('');document.getElementById('updated').textContent='마지막 갱신: '+new Date().toLocaleString('ko-KR');g.classList.remove('loading')}document.getElementById('refresh').onclick=load;load();setInterval(load,60000);if('serviceWorker'in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});</script></body></html>
