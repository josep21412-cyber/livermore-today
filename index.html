<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0f14"><title>Livermore Today</title><link rel="manifest" href="/manifest.webmanifest"><style>:root{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Inter,sans-serif;color:#f4f7fb;background:#0b0f14}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#0b0f14,#111824);min-height:100vh}.wrap{max-width:760px;margin:auto;padding:18px 16px 40px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.title{font-size:28px;font-weight:800}.sub{font-size:12px;color:#95a2b3}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.card{background:#151d29;border:1px solid #223044;border-radius:20px;padding:16px;box-shadow:0 10px 30px #0005}.ticker{font-size:20px;font-weight:800}.price{font-size:27px;font-weight:800;margin-top:8px}.chg.up{color:#60d394}.chg.down{color:#ff6b6b}.meta{font-size:12px;color:#9daabc;margin-top:6px;line-height:1.4}.state{display:inline-block;margin-top:12px;padding:6px 10px;border-radius:999px;background:#253247;font-weight:700;font-size:12px}.state.buy{background:#113a2b;color:#72e0a7}.state.wait{background:#2a3241;color:#d4d9e2}.state.sell{background:#4b2020;color:#ff9d9d}.state.add{background:#173b4b;color:#8edfff}.state.hold{background:#203a31;color:#9ee2bc}.row{display:flex;justify-content:space-between;font-size:12px;margin-top:7px;color:#b8c1cf}.note{margin-top:16px;font-size:12px;color:#8e9aab;line-height:1.5}.error{color:#ff8b8b;font-size:12px;margin-top:8px}.refresh{background:#f2f5f8;color:#111827;border:0;border-radius:12px;padding:10px 14px;font-weight:800}.pill{font-size:11px;color:#7f8da0}.loading{opacity:.65}.entrybox{margin-top:14px;padding-top:12px;border-top:1px solid #253247}.entrytitle{font-size:12px;font-weight:800;color:#dce4ef;margin-bottom:8px}.modes{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}.mode{display:flex;align-items:center;gap:6px;padding:8px 10px;border:1px solid #34465d;border-radius:10px;background:#111925;font-size:12px;font-weight:800}.mode input{width:18px;height:18px;accent-color:#8edfff}.section{margin-top:10px;padding:10px;background:#111925;border:1px solid #253247;border-radius:12px}.sectiontitle{font-size:12px;font-weight:800;margin-bottom:7px}.holdinggrid{display:grid;grid-template-columns:1fr 1fr;gap:6px}.lot{margin-top:8px;padding:10px;background:#0f1722;border:1px solid #253247;border-radius:12px}.lothead{display:flex;align-items:center;justify-content:space-between;margin-bottom:7px}.lottitle{font-size:12px;font-weight:800}.resetbtn{display:flex;align-items:center;justify-content:center;width:28px;height:28px;padding:0;border:1px solid #34465d;border-radius:8px;background:#1a2635;color:#c9d4e2;font-size:17px;line-height:1}.lotgrid{display:grid;grid-template-columns:1.35fr .8fr 1fr;gap:6px}.entryinput{width:100%;min-width:0;background:#0f1620;color:#f4f7fb;border:1px solid #2a394d;border-radius:9px;padding:9px 7px;font-size:16px;outline:none}.entryinput:focus{border-color:#58708f}.savebtn{width:100%;margin-top:8px;background:#253247;color:#f4f7fb;border:0;border-radius:10px;padding:9px 10px;font-weight:800;font-size:12px}.levels{margin-top:10px;padding-top:8px;border-top:1px dashed #2a394d}.levelnext{color:#8edfff}.leveldanger{color:#ff9d9d}.levelgood{color:#72e0a7}@media(max-width:520px){.grid{grid-template-columns:1fr}.title{font-size:25px}}</style></head><body><div class="wrap"><div class="top"><div><div class="title">Livermore Today</div><div class="sub">TQQQ · QQQ · TMF · NVDA · VOO · AAPL · V</div></div><button id="refresh" class="refresh">새로고침</button></div><div id="updated" class="pill">불러오는 중…</div><div id="grid" class="grid" style="margin-top:12px"></div><div class="note">앱을 열 때 한 번 시세를 불러와. 이후에는 상단 새로고침 버튼으로 직접 갱신할 수 있어. 기존보유와 신규매수는 서로 독립적으로 입력·분석돼.</div></div><script>const symbols=[['TQQQ',3],['QQQ',1],['TMF',3],['NVDA',1],['VOO',1],['AAPL',1],['V',1]];const STORE='livermore-entry-v3',OLD='livermore-entry-v2';function fmt(n){return n==null||!Number.isFinite(Number(n))?'—':'$'+Number(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})}function pct(n){return n==null||!Number.isFinite(Number(n))?'—':(n*100).toFixed(2)+'%'}function getStore(){let s={};try{s=JSON.parse(localStorage.getItem(STORE)||'{}')}catch{};try{const o=JSON.parse(localStorage.getItem(OLD)||'{}');for(const sym of Object.keys(o)){if(!s[sym]&&o[sym]?.date&&o[sym]?.price)s[sym]={newMode:true,holdingMode:false,lots:[{date:o[sym].date,qty:null,price:Number(o[sym].price)},{},{}]}}}catch{}for(const sym of Object.keys(s)){const v=s[sym]||{};if(v.newMode==null&&Array.isArray(v.lots))v.newMode=true;if(v.holdingMode==null)v.holdingMode=false;s[sym]=v}localStorage.setItem(STORE,JSON.stringify(s));return s}function blurAndTop(){const a=document.activeElement;if(a&&a.blur)a.blur();window.scrollTo({top:0,left:0,behavior:'auto'})}function toggleMode(sym,mode,checked){const s=getStore();s[sym]=s[sym]||{lots:[{},{},{}]};s[sym][mode]=checked;localStorage.setItem(STORE,JSON.stringify(s));load()}function saveAll(sym){const s=getStore();const v=s[sym]||{};v.holdingMode=document.getElementById(`hm-${sym}`)?.checked||false;v.newMode=document.getElementById(`nm-${sym}`)?.checked||false;if(v.holdingMode)v.holding={qty:Number(document.getElementById(`hq-${sym}`)?.value)||null,price:Number(document.getElementById(`hp-${sym}`)?.value)||null};if(v.newMode)v.lots=[1,2,3].map(n=>({date:document.getElementById(`d${n}-${sym}`)?.value||'',qty:Number(document.getElementById(`q${n}-${sym}`)?.value)||null,price:Number(document.getElementById(`p${n}-${sym}`)?.value)||null}));s[sym]=v;localStorage.setItem(STORE,JSON.stringify(s));blurAndTop();load().then(()=>window.scrollTo(0,0))}function resetLot(sym,n){const s=getStore(),v=s[sym]||{};const lots=v.lots||[{},{},{}];lots[n-1]={};v.lots=lots;s[sym]=v;localStorage.setItem(STORE,JSON.stringify(s));blurAndTop();load().then(()=>window.scrollTo(0,0))}function resetHolding(sym){const s=getStore(),v=s[sym]||{};v.holding={};s[sym]=v;localStorage.setItem(STORE,JSON.stringify(s));blurAndTop();load().then(()=>window.scrollTo(0,0))}async function yahoo(sym,range='10y',interval='1d'){const r=await fetch(`/api/yahoo?symbol=${encodeURIComponent(sym)}&range=${range}&interval=${interval}`,{cache:'no-store'});if(!r.ok)throw new Error('시세 조회 실패');const j=await r.json();if(j?.error)throw new Error(j.error);return j.chart?.result?.[0]}function sma(a,n){let s=0,cnt=0,out=Array(a.length).fill(null);for(let i=0;i<a.length;i++){if(a[i]!=null){s+=a[i];cnt++}if(i>=n&&a[i-n]!=null){s-=a[i-n];cnt--}if(i>=n-1&&cnt===n)out[i]=s/n}return out}function prevHigh(a,n,i){if(i<n)return null;let m=-Infinity;for(let k=i-n;k<i;k++)if(a[k]!=null)m=Math.max(m,a[k]);return Number.isFinite(m)?m:null}function dateStr(ts){return new Date(ts*1000).toISOString().slice(0,10)}function position(close,ts,lots,lev,live){const valid=(lots||[]).filter(x=>x?.date&&x?.price&&x?.qty),legacy=(lots||[]).filter(x=>x?.date&&x?.price);if(!legacy.length)return null;const first=legacy[0],qtyKnown=valid.length===legacy.length&&valid.length>0,totalQty=qtyKnown?valid.reduce((a,x)=>a+x.qty,0):null,avg=qtyKnown?valid.reduce((a,x)=>a+x.qty*x.price,0)/totalQty:first.price,stage=Math.min(legacy.length,3),step=.04*lev,stopPct=.06*lev,trailPct=.15*lev,next=stage<3?legacy[stage-1].price*(1+step):null;let start=ts.findIndex(t=>dateStr(t)>=first.date);if(start<0)start=0;let maxClose=first.price;for(let i=start;i<close.length;i++)if(close[i]!=null)maxClose=Math.max(maxClose,close[i]);const stop=avg*(1-stopPct),trail=maxClose*(1-trailPct),sell=Math.max(stop,trail),confirmed=close[close.length-1],px=Number(live)||confirmed;let state='보유',cls='hold',reason=`현재 ${fmt(px)} · 실질 매도선 ${fmt(sell)}`;if(confirmed<=sell){state='매도';cls='sell';reason=`확정 종가 ${fmt(confirmed)}가 실질 매도선 ${fmt(sell)} 이하입니다.`}else if(stage<3&&px>=next){state=`${stage+1}차 추가매수`;cls='add';reason=`현재가격이 ${stage+1}차 추가매수 기준 ${fmt(next)}을 충족했습니다.`}else if(stage<3){state=`${stage+1}차 매입 대기`;cls='wait';reason=`현재 ${fmt(px)} · 다음 추가매수 ${fmt(next)} · 실질 매도선 ${fmt(sell)}`}else reason=`현재 ${fmt(px)} · 3차 매입 완료 · 실질 매도선 ${fmt(sell)}`;return{stage,avg,totalQty,qtyKnown,next,maxClose,stop,trail,sell,state,cls,reason}}function holdingAnalysis(h,lev,live,c){if(!h?.qty||!h?.price)return null;const cost=h.qty*h.price,value=h.qty*live,gain=value-cost,rate=live/h.price-1,stop=h.price*(1-.06*lev),confirmedBelow=c<=stop;return{qty:h.qty,price:h.price,cost,value,gain,rate,stop,state:confirmedBelow?'매도 검토':'기존보유',cls:confirmedBelow?'sell':'hold'}}async function analyze(sym,lev){const d=await yahoo(sym);if(!d)throw new Error('데이터 없음');const q=d.indicators.quote[0],adj=d.indicators.adjclose?.[0]?.adjclose||q.close,close=q.close.map((v,i)=>adj[i]??v),ts=d.timestamp,ma=sma(close,200);let i=close.length-1;while(i>0&&close[i]==null)i--;const c=close[i],ph=prevHigh(close,40,i),m=ma[i],meta=d.meta||{},live=meta.regularMarketPrice??q.close[i]??c;let ri=q.close.length-1;while(ri>0&&q.close[ri]==null)ri--;const same=q.close[ri]!=null&&Math.abs(q.close[ri]-live)/Math.max(Math.abs(live),.01)<.02;let pi=same?ri-1:ri;while(pi>0&&q.close[pi]==null)pi--;let ch=q.close[pi]>0?live/q.close[pi]-1:null;if(ch!=null&&Math.abs(ch)>1)ch=null;const baseState=c>m&&c>ph?'BUY':'WAIT',baseCls=baseState==='BUY'?'buy':'wait',saved=getStore()[sym]||{},lots=saved.lots||[],pos=saved.newMode?position(close.slice(0,i+1),ts.slice(0,i+1),lots,lev,live):null,holding=saved.holdingMode?holdingAnalysis(saved.holding,lev,live,c):null;return{sym,lev,live,ch,c,m,ph,baseState,baseCls,saved,lots,pos,holding}}function lotBox(x,n){const l=x.lots[n-1]||{},show=n===1||x.lots.slice(0,n-1).some(a=>a?.date||a?.qty||a?.price);if(!show)return'';return`<div class="lot"><div class="lothead"><div class="lottitle">${n}차 매입</div><button class="resetbtn" type="button" aria-label="${n}차 매입 초기화" onclick="resetLot('${x.sym}',${n})">↻</button></div><div class="lotgrid"><input id="d${n}-${x.sym}" class="entryinput" type="date" value="${l.date||''}"><input id="q${n}-${x.sym}" class="entryinput" type="number" step="any" inputmode="decimal" placeholder="주식수" value="${l.qty||''}"><input id="p${n}-${x.sym}" class="entryinput" type="number" step="0.01" inputmode="decimal" placeholder="주당금액" value="${l.price||''}"></div></div>`}function newDetails(x){const p=x.pos;if(!p)return`<div class="levels"><div class="state ${x.baseCls}">${x.baseState}</div><div class="meta">${x.baseState==='BUY'?'200일선 위 + 40일 신고가 돌파':'신규매수 조건 미충족'}</div></div>`;return`<div class="levels"><div class="state ${p.cls}">${p.state}</div><div class="row"><span>실제 매입 차수</span><b>${p.stage}차</b></div><div class="row"><span>총 보유수량</span><b>${p.qtyKnown?p.totalQty.toLocaleString()+'주':'주식수 입력 필요'}</b></div><div class="row"><span>평균매입가</span><b>${p.qtyKnown?fmt(p.avg):'주식수 입력 필요'}</b></div>${p.next?`<div class="row"><span>다음 추가매수 기준</span><b class="levelnext">${fmt(p.next)}</b></div>`:''}<div class="row"><span>진입 후 최고 종가</span><b>${fmt(p.maxClose)}</b></div><div class="row"><span>손절선</span><b class="leveldanger">${p.qtyKnown?fmt(p.stop):'—'}</b></div><div class="row"><span>트레일링선</span><b class="leveldanger">${fmt(p.trail)}</b></div><div class="row"><span>실질 매도선</span><b class="leveldanger">${p.qtyKnown?fmt(p.sell):'—'}</b></div><div class="meta">${p.qtyKnown?p.reason:'주식수를 입력하면 평균매입가와 손절선이 정확히 계산돼.'}</div></div>`}function holdingBox(x){const h=x.saved.holding||{},a=x.holding;return`<div class="section"><div class="lothead"><div class="sectiontitle">기존보유</div><button class="resetbtn" type="button" aria-label="기존보유 초기화" onclick="resetHolding('${x.sym}')">↻</button></div><div class="holdinggrid"><input id="hq-${x.sym}" class="entryinput" type="number" step="any" inputmode="decimal" placeholder="주수" value="${h.qty||''}"><input id="hp-${x.sym}" class="entryinput" type="number" step="0.01" inputmode="decimal" placeholder="주당금액" value="${h.price||''}"></div>${a?`<div class="levels"><div class="state ${a.cls}">${a.state}</div><div class="row"><span>기존 평균매입가</span><b>${fmt(a.price)}</b></div><div class="row"><span>현재 평가금액</span><b>${fmt(a.value)}</b></div><div class="row"><span>평가손익</span><b class="${a.gain>=0?'levelgood':'leveldanger'}">${a.gain>=0?'+':''}${fmt(a.gain)} (${a.rate>=0?'+':''}${pct(a.rate)})</b></div><div class="row"><span>기존보유 손절 참고선</span><b class="leveldanger">${fmt(a.stop)}</b></div><div class="meta">기존보유분은 신규매수 기록과 분리해서 분석해.</div></div>`:'<div class="meta">주수와 기존 평균 주당금액을 입력해줘.</div>'}</div>`}function newBox(x){return`<div class="section"><div class="sectiontitle">신규매수</div>${lotBox(x,1)}${lotBox(x,2)}${lotBox(x,3)}${newDetails(x)}</div>`}function card(x){const hm=!!x.saved.holdingMode,nm=!!x.saved.newMode;return`<div class="card"><div class="ticker">${x.sym} <span class="pill">${x.lev}×</span></div><div class="price">${fmt(x.live)}</div><div class="chg ${x.ch>=0?'up':'down'}">${x.ch==null?'전일대비 —':'전일대비 '+(x.ch>=0?'+':'')+pct(x.ch)}</div><div class="row"><span>확정 종가</span><b>${fmt(x.c)}</b></div><div class="row"><span>200일선</span><b>${fmt(x.m)}</b></div><div class="row"><span>40일 돌파선</span><b>${fmt(x.ph)}</b></div><div class="entrybox"><div class="entrytitle">관리 방식</div><div class="modes"><label class="mode"><input id="hm-${x.sym}" type="checkbox" ${hm?'checked':''} onchange="toggleMode('${x.sym}','holdingMode',this.checked)"> 기존보유</label><label class="mode"><input id="nm-${x.sym}" type="checkbox" ${nm?'checked':''} onchange="toggleMode('${x.sym}','newMode',this.checked)"> 신규매수</label></div>${hm?holdingBox(x):''}${nm?newBox(x):''}${hm||nm?`<button class="savebtn" onclick="saveAll('${x.sym}')">저장 / 다시계산</button>`:'<div class="meta">분석할 방식을 체크해줘.</div>'}</div></div>`}async function load(){const g=document.getElementById('grid');g.classList.add('loading');g.innerHTML='';let arr=[];for(const[s,l]of symbols){try{arr.push(await analyze(s,l))}catch(e){g.innerHTML+=`<div class="card"><div class="ticker">${s}</div><div class="error">${e.message}</div></div>`}}if(arr.length)g.innerHTML=arr.map(card).join('');document.getElementById('updated').textContent='마지막 갱신: '+new Date().toLocaleString('ko-KR');g.classList.remove('loading')}document.getElementById('refresh').onclick=()=>{blurAndTop();load()};load();if('serviceWorker'in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});</script></body></html>
