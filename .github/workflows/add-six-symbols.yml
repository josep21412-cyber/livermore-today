name: Add six Livermore symbols

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/add-six-symbols.yml

permissions:
  contents: write

jobs:
  update-symbols:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/add-six-symbols
      - name: Add requested symbols without changing strategy
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          old_sub = 'TQQQ · QQQ · TMF · NVDA · VOO · AAPL · V'
          new_sub = 'TQQQ · QQQ · TMF · NVDA · VOO · AAPL · V · CRWV · IONQ · MP · NBIS · ORCL · TSLA'
          old_symbols = "const symbols=[['TQQQ',3],['QQQ',1],['TMF',3],['NVDA',1],['VOO',1],['AAPL',1],['V',1]];"
          new_symbols = "const symbols=[['TQQQ',3],['QQQ',1],['TMF',3],['NVDA',1],['VOO',1],['AAPL',1],['V',1],['CRWV',1],['IONQ',1],['MP',1],['NBIS',1],['ORCL',1],['TSLA',1]];"
          if s.count(old_sub) != 1:
              raise SystemExit(f'Expected subtitle exactly once, found {s.count(old_sub)}')
          if s.count(old_symbols) != 1:
              raise SystemExit(f'Expected symbols array exactly once, found {s.count(old_symbols)}')
          s = s.replace(old_sub, new_sub).replace(old_symbols, new_symbols)
          p.write_text(s)
          PY
      - name: Commit change to feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Add CRWV IONQ MP NBIS ORCL TSLA"
          git push origin HEAD:feature/add-six-symbols
